<div class="container-fluid mt-4">
  <div class="row">
    <h1 class="text-md-center">Employees List</h1>
  </div>

  <div class="row mb-3">
    <div class="col-auto">
      <button routerLink="/employees/add" class="btn btn-primary">Add Employee</button>
    </div>

    <div class="col"></div>

    <div class="col-auto">
      <form (ngSubmit)="getFilteredEmployees(searchInput.value)">
        <div class="input-group">
          <input #searchInput type="text" name="search" class="form-control" placeholder="Search" />
          <button type="submit" class="btn btn-outline-secondary">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th>Employee First Name</th>
            <th>Employee Last Name</th>
            <th>Employee Email</th>
            <th>Employee Department</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (employee of employees; track $index) {
            <tr>
              <td>{{ employee.first_name }}</td>
              <td>{{ employee.last_name }}</td>
              <td>{{ employee.email }}</td>
              <td>{{ employee.department }}</td>

              <td>
                <div class="d-flex gap-2">
                  <button routerLink="/employees/details/{{ employee.id }}" class="btn btn-info">
                    View
                  </button>
                  <button routerLink="/employees/update/{{ employee.id }}" class="btn btn-warning">
                    Update
                  </button>
                  <button class="btn btn-danger" (click)="deleteEmployee(employee.id)">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
